name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build · vet · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  frontend:
    name: Frontend (typecheck · lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint

  # End-to-end smoke test: deploys a workload through the real agent loop against
  # a live Docker-in-Docker daemon, with a mock Groq so no LLM quota is used.
  # Non-blocking for now — the dind + shared /vm-storage wiring below has not been
  # validated on a real run yet. Once it passes, drop `continue-on-error`.
  smoke:
    name: E2E smoke (deploy)
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      dind:
        image: docker:27-dind
        env:
          DOCKER_TLS_CERTDIR: ""
        ports:
          - 2375:2375
        options: --privileged
        volumes:
          - /vm-storage:/vm-storage
    env:
      DOCKER_HOST: tcp://localhost:2375
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Prepare shared storage
        run: sudo mkdir -p /vm-storage && sudo chmod 777 /vm-storage
      - name: Wait for the Docker daemon
        run: |
          for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 1; done
          docker info
      - name: Pre-pull the workload image
        run: docker pull python:3.12-slim
      - name: Run smoke test
        run: go test -tags smoke -run TestSmokeDeploy -timeout 10m ./internal/agent/...
